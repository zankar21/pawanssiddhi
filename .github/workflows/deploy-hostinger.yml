# .github/workflows/deploy-hostinger.yml
name: Build and push to deploy branch
on:
  push:
    branches: [ main ]

# ✅ allow this workflow to push to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: CI=false npm run build
      - run: |
          echo "== build/ contents =="
          ls -la build || true

      - name: Push build/ to deploy branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy
          folder: build
          clean: true
          single-commit: true
          # ✅ explicitly use the repo token
          token: ${{ secrets.GITHUB_TOKEN }}
